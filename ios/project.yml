name: BabyTrack
options:
  bundleIdPrefix: com.joedimos
  deploymentTarget:
    iOS: "17.0"
targets:
  BabyTrack:
    type: application
    platform: iOS
    sources: [BabyTrack]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joedimos.babytrack
        PRODUCT_NAME: Baby Track
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Baby Track
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
