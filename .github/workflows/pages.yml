name: Deploy Baby Track to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate web application
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f midwife-data.js
          test -f midwife.js
          test -f birth-intelligence.js
          test -f manifest.webmanifest
          test -f sw.js
          node --check app.js
          node --check midwife-data.js
          node --check midwife.js
          node --check birth-intelligence.js
          grep -q 'birth-intelligence.js' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
